<svg xmlns="http://www.w3.org/2000/svg" width="900" height="724" viewBox="0 0 900 724" role="img" aria-labelledby="title description">
  <title id="title">웹은 별도 배포, 앱 공통 배관은 재사용</title>
  <desc id="description">기존에는 웹 서비스마다 네이티브 셸 설정, 플러그인 연결, 빌드 구성을 반복한다. app-harness-hpark를 사용하면 각 서비스의 설정과 AppBridge 연결을 공유 하네스에 적용해 서비스별 iOS 및 Android 앱을 만든다.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .ink { fill: #17233B; }
      .muted { fill: #52627B; }
      .old { fill: #B74E40; }
      .new { fill: #087E72; }
      .label { font-size: 17px; font-weight: 700; }
      .card { font-size: 19px; font-weight: 700; }
      .small { font-size: 16px; font-weight: 600; }
    </style>
    <marker id="arrow-old" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#CF8579" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-new" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#159589" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <rect width="900" height="724" rx="26" fill="#F7FAFC"/>
  <text x="44" y="50" fill="#087E72" font-size="16" font-weight="800" letter-spacing="1.2">APP-HARNESS-HPARK</text>
  <text x="44" y="100" class="ink" font-size="33" font-weight="800">웹은 별도 배포. 앱 공통 배관은 재사용.</text>
  <text x="44" y="132" class="muted" font-size="18">새 웹 서비스마다 iOS·Android 앱을 더 빠르게 만듭니다.</text>

  <rect x="24" y="160" width="852" height="230" rx="22" fill="#FFFDFB" stroke="#E8CCC6" stroke-width="1.5"/>
  <rect x="48" y="181" width="105" height="34" rx="17" fill="#FCECE8"/>
  <text x="100.5" y="204" text-anchor="middle" class="old label">기존 방식</text>
  <text x="174" y="204" class="ink" font-size="19" font-weight="700">웹 서비스마다 같은 네이티브 작업 반복</text>

  <rect x="55" y="230" width="102" height="58" rx="12" fill="#FFFFFF" stroke="#D8E0E7" stroke-width="1.5"/>
  <rect x="69" y="240" width="24" height="21" rx="4" fill="#EAF1F6"/>
  <path d="M69 247 H93" stroke="#B9C8D5" stroke-width="1"/>
  <text x="110" y="266" text-anchor="middle" class="ink card">웹 A</text>
  <path d="M172 259 H206" stroke="#CF8579" stroke-width="2.5" fill="none" marker-end="url(#arrow-old)"/>
  <rect x="218" y="230" width="410" height="58" rx="12" fill="#FFFFFF" stroke="#E4CBC6" stroke-width="1.5"/>
  <text x="423" y="266" text-anchor="middle" class="ink" font-size="18" font-weight="650">셸 설정 · 플러그인 연결 · 빌드 구성</text>
  <path d="M641 259 H672" stroke="#CF8579" stroke-width="2.5" fill="none" marker-end="url(#arrow-old)"/>
  <rect x="687" y="230" width="157" height="58" rx="12" fill="#FFFFFF" stroke="#D8E0E7" stroke-width="1.5"/>
  <text x="765.5" y="266" text-anchor="middle" class="ink" font-size="18" font-weight="700">iOS · Android</text>

  <rect x="55" y="309" width="102" height="58" rx="12" fill="#FFFFFF" stroke="#D8E0E7" stroke-width="1.5"/>
  <rect x="69" y="319" width="24" height="21" rx="4" fill="#EAF1F6"/>
  <path d="M69 326 H93" stroke="#B9C8D5" stroke-width="1"/>
  <text x="110" y="345" text-anchor="middle" class="ink card">웹 B</text>
  <path d="M172 338 H206" stroke="#CF8579" stroke-width="2.5" fill="none" marker-end="url(#arrow-old)"/>
  <rect x="218" y="309" width="410" height="58" rx="12" fill="#FFFFFF" stroke="#E4CBC6" stroke-width="1.5"/>
  <text x="423" y="345" text-anchor="middle" class="ink" font-size="18" font-weight="650">셸 설정 · 플러그인 연결 · 빌드 구성</text>
  <path d="M641 338 H672" stroke="#CF8579" stroke-width="2.5" fill="none" marker-end="url(#arrow-old)"/>
  <rect x="687" y="309" width="157" height="58" rx="12" fill="#FFFFFF" stroke="#D8E0E7" stroke-width="1.5"/>
  <text x="765.5" y="345" text-anchor="middle" class="ink" font-size="18" font-weight="700">iOS · Android</text>

  <rect x="24" y="407" width="852" height="287" rx="22" fill="#F8FFFD" stroke="#A6D9CF" stroke-width="1.5"/>
  <rect x="48" y="428" width="105" height="34" rx="17" fill="#DDF5EE"/>
  <text x="100.5" y="451" text-anchor="middle" class="new label">하네스</text>
  <text x="174" y="451" class="ink" font-size="19" font-weight="700">서비스별 작업을 공통 하네스에 연결</text>

  <text x="112" y="493" text-anchor="middle" class="muted small">각 웹 서비스</text>
  <text x="337" y="493" text-anchor="middle" class="muted small">서비스별 연결</text>
  <text x="570" y="493" text-anchor="middle" class="muted small">공통 기반 재사용</text>
  <text x="773" y="493" text-anchor="middle" class="muted small">서비스별 앱</text>

  <rect x="59" y="510" width="106" height="47" rx="10" fill="#FFFFFF" stroke="#BDD7D1" stroke-width="1.5"/>
  <text x="112" y="540" text-anchor="middle" class="ink card">웹 A</text>
  <rect x="59" y="565" width="106" height="47" rx="10" fill="#FFFFFF" stroke="#BDD7D1" stroke-width="1.5"/>
  <text x="112" y="595" text-anchor="middle" class="ink card">웹 B</text>
  <path d="M177 561 H223" stroke="#159589" stroke-width="2.5" fill="none" marker-end="url(#arrow-new)"/>

  <rect x="236" y="510" width="196" height="102" rx="16" fill="#FFFFFF" stroke="#82CBBB" stroke-width="1.8"/>
  <text x="334" y="548" text-anchor="middle" class="ink" font-size="18" font-weight="750">하네스: 앱별 설정</text>
  <path d="M265 558 H403" stroke="#E0F1ED" stroke-width="1.5"/>
  <text x="334" y="586" text-anchor="middle" class="new" font-size="16" font-weight="700">웹: AppBridge 연결</text>
  <path d="M443 561 H470" stroke="#159589" stroke-width="2.5" fill="none" marker-end="url(#arrow-new)"/>

  <rect x="483" y="510" width="176" height="102" rx="16" fill="#123F4D"/>
  <text x="571" y="547" text-anchor="middle" fill="#FFFFFF" font-size="21" font-weight="750">공유 하네스</text>
  <text x="571" y="579" text-anchor="middle" fill="#BCE6DF" font-size="16" font-weight="600">Capacitor 셸 · 빌드</text>
  <path d="M669 561 H697" stroke="#159589" stroke-width="2.5" fill="none" marker-end="url(#arrow-new)"/>

  <rect x="710" y="510" width="136" height="102" rx="16" fill="#FFFFFF" stroke="#82CBBB" stroke-width="1.8"/>
  <rect x="729" y="525" width="42" height="61" rx="8" fill="#E8F6F2" stroke="#087E72" stroke-width="2"/>
  <path d="M742 532 H758" stroke="#087E72" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="785" y="525" width="42" height="61" rx="8" fill="#E8F6F2" stroke="#087E72" stroke-width="2"/>
  <path d="M798 532 H814" stroke="#087E72" stroke-width="1.5" stroke-linecap="round"/>
  <text x="750" y="602" text-anchor="middle" class="ink" font-size="13" font-weight="750">iOS</text>
  <text x="806" y="602" text-anchor="middle" class="ink" font-size="13" font-weight="750">Android</text>

  <rect x="57" y="632" width="365" height="43" rx="12" fill="#E8F7F2"/>
  <text x="239.5" y="659" text-anchor="middle" class="new" font-size="17" font-weight="700">네이티브 기본 구조를 반복 사용</text>
  <rect x="433" y="632" width="413" height="43" rx="12" fill="#E8F7F2"/>
  <text x="639.5" y="659" text-anchor="middle" class="new" font-size="17" font-weight="700">웹 화면 변경은 웹 배포로 반영</text>
</svg>
