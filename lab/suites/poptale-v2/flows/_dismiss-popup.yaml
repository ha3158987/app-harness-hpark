# 홈 이벤트 팝업이 떠 있으면 '7일간 보지 않기' + 확인으로 닫는다 — 같은 설치에서 다음 플로우부터는 안 뜬다.
# 팝업은 모달이라 열려 있는 동안 뒤 화면이 접근성 트리에서 숨는다 → 닫기 전엔 헤더·탭을 찾지 마라.
# 팝업 자체(7일 숨김·중첩·링크)는 웹 e2e(m6-popup)가 지킨다. 탭은 optional — 사이에 팝업이 닫혀도 실패로 치지 않는다.
appId: ${APP_ID}
tags: [helper]
---
# 팝업은 홈 데이터가 온 뒤 늦게 뜬다(느린 기기에서 헤더보다 10초 이상 늦게 — 2026-10-06 실측)
- extendedWaitUntil:
    visible: ${L_OK}
    timeout: 15000
    optional: true
# 팝업이 없으면 바로 지나가고(when), 있으면 사이에 닫혀도 실패로 치지 않는다(optional)
- runFlow:
    when:
      visible: ${L_OK}
    commands:
      - tapOn:
          text: ${L_DISMISS_7}
          optional: true
      - tapOn:
          text: ${L_OK}
          optional: true
