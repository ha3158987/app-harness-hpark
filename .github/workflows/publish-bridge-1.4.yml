name: publish-bridge-1.4

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@ha3158987'
      - run: npm ci
      - run: npm test
      - name: Prepare original 1.4.0 bridge under personal scope
        run: |
          git restore --source=d7fb0444b3953327b408e01b7ccbf1d692ae9c7e --staged --worktree -- template/bridge
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'template/bridge/package.json';
          const pkg = JSON.parse(readFileSync(file, 'utf8'));
          if (pkg.version !== '1.4.0') throw new Error('Unexpected bridge version');
          pkg.name = '@ha3158987/harness-bridge';
          pkg.author = 'ha3158987 <65105537+ha3158987@users.noreply.github.com>';
          pkg.repository = {
            type: 'git',
            url: 'git+https://github.com/ha3158987/app-harness-hpark.git',
          };
          writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          node --check template/bridge/dist/index.js
          node --check template/bridge/dist/web.js
      - run: npm publish --dry-run --tag latest
        working-directory: template/bridge
      - run: npm publish --tag latest
        working-directory: template/bridge
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
