# 앱 빌드 → 스토어 자동 배포 (베타/내부 트랙까지). 프로덕션 공개는 수동(STRATEGY 안전원칙).
#
# 트리거 2가지:
#   1) 태그 푸시:   <slug>-v<버전>   예) aipia-v1.2.0   → slug=aipia, 양쪽 플랫폼, internal 트랙
#                   Android 는 Firebase App Distribution + Play 내부트랙 **둘 다** 나간다.
#   2) 수동 실행:   Actions 탭에서 slug/platform/track/android_channel 선택
#
# 필요한 GitHub Secrets/Variables 는 docs/08-DEPLOY.md §4 참조. 시크릿 없으면 해당 잡은 실패
# (빌드까지는 가능). Firebase App Distribution 만 변수 미설정 시 조용히 건너뛴다.
name: release

on:
  push:
    tags:
      - '*-v*'            # 예: aipia-v1.2.0
  workflow_dispatch:
    inputs:
      slug:
        description: '앱 slug (apps/<slug>)'
        required: true
        type: string
      platform:
        description: '빌드 플랫폼'
        required: true
        default: 'both'
        type: choice
        options: [android, ios, both]
      track:
        description: 'Android Play 트랙'
        required: true
        default: 'internal'
        type: choice
        options: [internal, beta]
      android_channel:
        description: 'Android 배포 채널 (firebase=테스터에게 즉시 / play=스토어 내부트랙)'
        required: true
        default: 'both'
        type: choice
        options: [both, firebase, play]
      firebase_groups:
        description: 'Firebase 테스터 그룹 별칭 (콘솔에서 만든 이름, 쉼표 구분)'
        required: false
        default: 'aipia_internal'
        type: string
      ios_channel:
        description: 'iOS 테스트 채널 (Firebase는 기기 등록 및 Ad Hoc 프로파일 필요)'
        required: true
        default: 'testflight'
        type: choice
        options: [testflight, firebase, both]

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.r.outputs.slug }}
      slug_env: ${{ steps.r.outputs.slug_env }}   # 시크릿 이름용 (대문자, - → _)
      platform: ${{ steps.r.outputs.platform }}
      track: ${{ steps.r.outputs.track }}
      android_channel: ${{ steps.r.outputs.android_channel }}
      firebase_groups: ${{ steps.r.outputs.firebase_groups }}
      ios_channel: ${{ steps.r.outputs.ios_channel }}
    steps:
      - id: r
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slug=${{ inputs.slug }}"        >> "$GITHUB_OUTPUT"
            echo "platform=${{ inputs.platform }}" >> "$GITHUB_OUTPUT"
            echo "track=${{ inputs.track }}"       >> "$GITHUB_OUTPUT"
            echo "android_channel=${{ inputs.android_channel }}" >> "$GITHUB_OUTPUT"
            echo "firebase_groups=${{ inputs.firebase_groups }}" >> "$GITHUB_OUTPUT"
            echo "ios_channel=${{ inputs.ios_channel || 'testflight' }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF_NAME}"     # 예: aipia-v1.2.0
            echo "slug=${TAG%-v*}"  >> "$GITHUB_OUTPUT"
            echo "platform=both"    >> "$GITHUB_OUTPUT"
            echo "track=internal"   >> "$GITHUB_OUTPUT"
            echo "android_channel=both"     >> "$GITHUB_OUTPUT"
            echo "firebase_groups=aipia_internal" >> "$GITHUB_OUTPUT"
            echo "ios_channel=testflight" >> "$GITHUB_OUTPUT"
          fi
          # slug 별 시크릿 조회용 정규화 이름 (예: characterchat-dev → CHARACTERCHAT_DEV)
          SLUG_LINE=$(grep '^slug=' "$GITHUB_OUTPUT" | tail -1)
          echo "slug_env=$(echo "${SLUG_LINE#slug=}" | tr '[:lower:]-' '[:upper:]_')" >> "$GITHUB_OUTPUT"
      - run: echo "slug=${{ steps.r.outputs.slug }} platform=${{ steps.r.outputs.platform }} track=${{ steps.r.outputs.track }} android_channel=${{ steps.r.outputs.android_channel }}"

  android:
    needs: resolve
    if: ${{ needs.resolve.outputs.platform == 'android' || needs.resolve.outputs.platform == 'both' }}
    runs-on: ubuntu-latest
    # id-token: GitHub OIDC 토큰 발급용. Firebase 인증이 이걸로 돈다(서비스 계정 키 없음).
    permissions:
      contents: read
      id-token: write
    env:
      SLUG: ${{ needs.resolve.outputs.slug }}
      # Firebase 인증(WIF) 설정 — 시크릿이 아니라 **변수(vars)** 다. Firebase 프로젝트가
      # 앱마다 다르므로 슬러그별 우선, 없으면 공통값. 미설정이면 Firebase 배포를 건너뛴다.
      WIF_PROVIDER: ${{ vars[format('FIREBASE_WIF_PROVIDER_{0}', needs.resolve.outputs.slug_env)] || vars.FIREBASE_WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ vars[format('FIREBASE_WIF_SERVICE_ACCOUNT_{0}', needs.resolve.outputs.slug_env)] || vars.FIREBASE_WIF_SERVICE_ACCOUNT }}
      # QR 고정 링크용 공개 버킷. 미설정이면 GCS 업로드 스텝을 통째로 건너뛴다.
      APK_DIST_BUCKET: ${{ vars[format('APK_DIST_BUCKET_{0}', needs.resolve.outputs.slug_env)] || vars.APK_DIST_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      # v3 는 기본 packages 가 'tools platform-tools' 인데, Google 이 구식 'tools' 패키지를
      # SDK 저장소에서 내려 `Failed to find package 'tools'` 로 죽는다(2026-09-07 이후 회귀).
      # v4 는 기본값이 'platform-tools' 로 바뀌었다 — 그게 이 문제의 수정이다.
      - uses: android-actions/setup-android@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      # 플러그인은 Fastfile 이 직접 require 한다(번들러 미사용 → Pluginfile 자동로드 안 됨).
      # 1.0.0 부터 external_account(WIF) 자격증명을 지원한다 — 아래 OIDC 인증이 그걸 쓴다.
      - run: gem install fastlane --no-document && gem install fastlane-plugin-firebase_app_distribution --no-document --version '>= 1.0.0'

      - name: Android 배포 파일명 검증
        run: ruby test/android-artifact-filenames-test.rb fastlane/Fastfile

      - name: Capacitor 프로젝트 생성/동기화
        # 어트리뷰션 키는 generate-app 이 네이티브 번들에 베이크한다 — **이 스텝에** 있어야 한다.
        # 슬러그별(<NAME>_<SLUG대문자_하이픈→언더스코어>) 우선, 없으면 공통값. 둘 다 없으면
        # 빌드는 되지만 SDK 가 런타임 비활성이라 어트리뷰션이 수집되지 않는다.
        env:
          ADBRIX_APP_KEY: ${{ secrets[format('ADBRIX_APP_KEY_{0}', needs.resolve.outputs.slug_env)] || secrets.ADBRIX_APP_KEY }}
          ADBRIX_SECRET_KEY: ${{ secrets[format('ADBRIX_SECRET_KEY_{0}', needs.resolve.outputs.slug_env)] || secrets.ADBRIX_SECRET_KEY }}
          APPSFLYER_DEV_KEY: ${{ secrets[format('APPSFLYER_DEV_KEY_{0}', needs.resolve.outputs.slug_env)] || secrets.APPSFLYER_DEV_KEY }}
          APPSFLYER_IOS_APP_ID: ${{ secrets[format('APPSFLYER_IOS_APP_ID_{0}', needs.resolve.outputs.slug_env)] || secrets.APPSFLYER_IOS_APP_ID }}
        run: node scripts/generate-app.mjs --slug "$SLUG" --platform android --release

      - name: 아이콘/스플래시 (소스 있을 때만)
        run: |
          if [ -f "apps/$SLUG/icon.png" ]; then
            cd "build/$SLUG"
            npx --yes @capacitor/assets generate --assetPath "../../apps/$SLUG"
            npx cap sync android
          else
            echo "apps/$SLUG/icon.png 없음 — 기본 아이콘으로 진행"
          fi

      - name: google-services.json 주입 (FCM — 시크릿 → 파일)
        # firebase.enabled 앱의 푸시용. 시크릿 미설정이면 스킵(비 FCM 앱).
        # 시크릿 이름: GOOGLE_SERVICES_B64_<SLUG 대문자, -는 _> (base64 원문)
        env:
          GS_B64: ${{ secrets[format('GOOGLE_SERVICES_B64_{0}', needs.resolve.outputs.slug_env)] }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > "build/$SLUG/android/app/google-services.json"
            echo "google-services.json 배치됨 (FCM 활성)"
          else
            echo "::notice::GOOGLE_SERVICES_B64_* 시크릿 없음 — FCM 미사용 앱으로 진행"
          fi

      - name: 릴리즈 keystore 주입 (시크릿 → 파일)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "build/$SLUG/android/release.keystore"
          cat > "build/$SLUG/android/keystore.properties" <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # ── 테스터 배포(즉시) ── Play 보다 **먼저** 돈다. Play 업로드는 versionCode 중복·앱
      # 레코드 미등록 같은 이유로 곧잘 실패하는데, 그때도 내부 테스터는 빌드를 받아야 한다.
      #
      # 인증은 **서비스 계정 키가 아니라 GitHub OIDC(WIF)** 다. aipia 조직은 org policy
      # `iam.disableServiceAccountKeyCreation` 으로 키 발급 자체를 막아둬서 키 방식은 불가능하다.
      - name: GCP 인증 (GitHub OIDC → 서비스 계정 가장, 키 없음)
        id: gcp_auth
        if: ${{ env.WIF_PROVIDER != '' && (needs.resolve.outputs.android_channel != 'play' || env.APK_DIST_BUCKET != '') }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Firebase App Distribution 업로드 (내부 테스터 즉시 배포)
        if: ${{ needs.resolve.outputs.android_channel != 'play' }}
        env:
          FIREBASE_TESTER_GROUPS: ${{ needs.resolve.outputs.firebase_groups }}
          # 위 인증 스텝이 만든 external_account 자격증명 파일. 스텝이 스킵되면 빈 값.
          FIREBASE_SERVICE_CREDENTIALS_FILE: ${{ steps.gcp_auth.outputs.credentials_file_path }}
        run: |
          # WIF 변수나 Firebase 설정이 없는 앱은 조용히 건너뛴다 — 태그 푸시 기본값이 both 라,
          # 여기서 실패하면 Firebase 안 쓰는 앱의 배포가 통째로 막힌다.
          if [ -z "$FIREBASE_SERVICE_CREDENTIALS_FILE" ]; then
            echo "::notice::FIREBASE_WIF_PROVIDER* 변수 미설정 — Firebase 배포 건너뜀 (docs/08-DEPLOY.md §10)"
            exit 0
          fi
          if [ ! -f "build/$SLUG/android/app/google-services.json" ]; then
            echo "::notice::google-services.json 없음 — Firebase 미등록 앱, 배포 건너뜀"
            exit 0
          fi
          NOTES="${GITHUB_REF_NAME} · $(git log -1 --pretty=%s)"
          fastlane android firebase slug:"$SLUG" \
            groups:"${FIREBASE_TESTER_GROUPS:-aipia_internal}" \
            notes:"$NOTES"

      - name: Play 업로드 (fastlane, 내부/베타 트랙)
        if: ${{ needs.resolve.outputs.android_channel != 'firebase' }}
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: fastlane android beta slug:"$SLUG" track:"${{ needs.resolve.outputs.track }}"

      # ── QR 고정 링크 배포 ── 스토어 릴리즈 때도 같은 URL 이 최신 빌드를 서빙하게 한다.
      # 경로가 slug 별로 고정(android/<slug>.apk)이라 한 번 뿌린 QR 을 계속 쓴다.
      # 로컬 수동 경로(scripts/publish-apk.mjs)와 같은 버킷·같은 규칙이다.
      - name: gcloud 준비
        if: ${{ env.APK_DIST_BUCKET != '' && env.WIF_PROVIDER != '' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: APK 를 GCS 고정 경로에 업로드 (QR 재사용)
        if: ${{ env.APK_DIST_BUCKET != '' && env.WIF_PROVIDER != '' }}
        run: |
          set -euo pipefail
          APK="build/$SLUG/android/app/build/outputs/apk/release/app-release.apk"
          # android_channel=play 로 돌면 Firebase 스텝이 스킵돼 APK 가 없다 — 여기서 굽는다.
          if [ ! -f "$APK" ]; then
            echo "APK 없음 — build_apk 실행"
            fastlane android build_apk slug:"$SLUG"
          fi
          # no-cache 가 핵심: 고정 경로에 덮어쓰므로, 캐시가 걸리면 QR 을 찍은 사람이 옛 빌드를 받는다.
          COMMON=(--content-type=application/vnd.android.package-archive --cache-control="no-cache, max-age=0")
          gcloud storage cp "$APK" "gs://$APK_DIST_BUCKET/android/$SLUG.apk" "${COMMON[@]}"
          # 이력 사본은 겹치지 않게: 태그면 태그명, 수동 실행이면 브랜치+런번호.
          STAMP="$(echo "${GITHUB_REF_NAME}" | tr "/" "-")-${GITHUB_RUN_NUMBER}"
          gcloud storage cp "$APK" "gs://$APK_DIST_BUCKET/android/archive/$SLUG-$STAMP.apk" "${COMMON[@]}"
          URL="https://storage.googleapis.com/$APK_DIST_BUCKET/android/$SLUG.apk"
          # 올렸다고 끝이 아니다 — 공개로 실제 받아지는지 확인한다(버킷 권한이 바뀌면 여기서 잡힌다).
          curl -sfI "$URL" > /dev/null || { echo "::error::공개 URL 이 200 이 아니다: $URL"; exit 1; }
          echo "### 설치 링크 (QR 그대로 사용)" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

      # Play 업로드가 실패한 순간이 AAB 가 **가장 필요한** 때다(콘솔에서 손으로 올려야 하므로).
      # if 가 없으면 그때 이 스텝이 통째로 건너뛰어져 받을 파일이 남지 않는다 — 실제로
      # 2026-09-18 poptale-global 첫 업로드(권한 오류)에서 그렇게 잃었다.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ${{ env.SLUG }}-aab
          path: build/${{ env.SLUG }}/android/artifacts/*.aab
          if-no-files-found: warn

      # Firebase 를 안 쓰는 앱이나 배포 실패 시의 폴백(= 지금까지 쓰던 URL 다운로드 경로).
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && needs.resolve.outputs.android_channel != 'play' }}
        with:
          name: ${{ env.SLUG }}-apk
          path: build/${{ env.SLUG }}/android/artifacts/*.apk
          if-no-files-found: ignore

  ios:
    needs: resolve
    if: ${{ needs.resolve.outputs.platform == 'ios' || needs.resolve.outputs.platform == 'both' }}
    runs-on: macos-latest
    # macOS 러너는 분당 요금이 10배다. 서명이 매달리면(키체인 승인 팝업 대기 등) 잡이
    # **기본 6시간**을 다 태우고 죽는다 — 실제로 2026-09-15 에 그렇게 6시간을 날렸다.
    # 정상 빌드는 20분 안쪽이므로 넉넉히 잡아도 60분이면 충분하다.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      SLUG: ${{ needs.resolve.outputs.slug }}
      WIF_PROVIDER: ${{ vars[format('FIREBASE_WIF_PROVIDER_{0}', needs.resolve.outputs.slug_env)] || vars.FIREBASE_WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ vars[format('FIREBASE_WIF_SERVICE_ACCOUNT_{0}', needs.resolve.outputs.slug_env)] || vars.FIREBASE_WIF_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - name: 최신 Xcode 선택 (Apple iOS 26 SDK 요구)
        run: |
          echo "설치된 Xcode 목록:"; ls -d /Applications/Xcode_*.app 2>/dev/null || true
          LATEST="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$LATEST" ]; then echo "Xcode_*.app 없음 — 기본 사용"; else
            echo "선택: $LATEST"; sudo xcode-select -s "$LATEST/Contents/Developer"; fi
          xcodebuild -version

      - uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc' }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - name: iOS Firebase 배포 경로 검증
        run: ruby test/ios-firebase-test.rb fastlane/Fastfile
      - run: gem install fastlane --no-document
      - name: Firebase 배포 플러그인
        if: ${{ needs.resolve.outputs.ios_channel != 'testflight' }}
        run: gem install fastlane-plugin-firebase_app_distribution --no-document --version '>= 1.0.0'

      - name: iOS 배포 파일명 검증
        run: ruby test/ios-artifact-filenames-test.rb fastlane/Fastfile

      - name: Capacitor 프로젝트 생성/동기화 (iOS 포함)
        # 어트리뷰션 키는 generate-app 이 네이티브 번들에 베이크한다 — **이 스텝에** 있어야 한다.
        # 슬러그별(<NAME>_<SLUG대문자_하이픈→언더스코어>) 우선, 없으면 공통값. 둘 다 없으면
        # 빌드는 되지만 SDK 가 런타임 비활성이라 어트리뷰션이 수집되지 않는다.
        env:
          ADBRIX_APP_KEY: ${{ secrets[format('ADBRIX_APP_KEY_{0}', needs.resolve.outputs.slug_env)] || secrets.ADBRIX_APP_KEY }}
          ADBRIX_SECRET_KEY: ${{ secrets[format('ADBRIX_SECRET_KEY_{0}', needs.resolve.outputs.slug_env)] || secrets.ADBRIX_SECRET_KEY }}
          APPSFLYER_DEV_KEY: ${{ secrets[format('APPSFLYER_DEV_KEY_{0}', needs.resolve.outputs.slug_env)] || secrets.APPSFLYER_DEV_KEY }}
          APPSFLYER_IOS_APP_ID: ${{ secrets[format('APPSFLYER_IOS_APP_ID_{0}', needs.resolve.outputs.slug_env)] || secrets.APPSFLYER_IOS_APP_ID }}
        run: node scripts/generate-app.mjs --slug "$SLUG" --platform ios --release

      - name: 아이콘/스플래시 (소스 있을 때만)
        run: |
          if [ -f "apps/$SLUG/icon.png" ]; then
            cd "build/$SLUG"
            npx --yes @capacitor/assets generate --assetPath "../../apps/$SLUG"
            npx cap sync ios
          else
            echo "apps/$SLUG/icon.png 없음 — 기본 아이콘으로 진행"
          fi

      - name: GoogleService-Info.plist 주입 (iOS FCM — 시크릿 → 파일)
        # firebase.enabled+fcm 앱의 iOS 푸시용. 시크릿 미설정이면 스킵(비 FCM iOS 앱).
        # 시크릿 이름: GOOGLE_SERVICE_INFO_PLIST_B64_<SLUG 대문자, -는 _> (base64 원문)
        # ⚠️ generate-app 이 firebase.fcm 일 때 pbxproj 에 이 plist 를 리소스로 등록하므로,
        #    firebase.fcm 앱은 이 시크릿이 반드시 있어야 빌드가 통과한다(없으면 리소스 누락으로 실패).
        env:
          GSI_B64: ${{ secrets[format('GOOGLE_SERVICE_INFO_PLIST_B64_{0}', needs.resolve.outputs.slug_env)] }}
        run: |
          if [ -n "$GSI_B64" ]; then
            echo "$GSI_B64" | base64 -d > "build/$SLUG/ios/App/GoogleService-Info.plist"
            echo "GoogleService-Info.plist 배치됨 (iOS FCM 활성)"
          else
            echo "::notice::GOOGLE_SERVICE_INFO_PLIST_B64_* 시크릿 없음 — iOS FCM 미사용으로 진행"
          fi

      # 서명 인증서의 **출처는 match 저장소 한 곳뿐이다.** 여기서는 빈 키체인만 만들어
      # 그 이름과 비밀번호를 match 에 넘긴다 — 인증서를 내려받아 설치하는 건 match 가 한다.
      #
      # 왜 이렇게 바꿨나(2026-09-15): 예전에는 이 스텝이 `IOS_DIST_P12_BASE64` 시크릿의
      # p12 를 직접 주입했다. 그래서 인증서가 **match 저장소와 GitHub 시크릿 두 곳**에
      # 존재했고, 인증서를 갱신하면 시크릿이 조용히 낡았다. 실제로 그날 인증서를 갱신하자
      # 프로파일은 새 인증서를 가리키는데 시크릿은 옛 인증서라, match 가 새 개인키를
      # login.keychain 에 넣으면서 비번을 몰라 partition list 설정에 실패했고
      # (`Could not configure imported keychain item ... to prevent UI permission popup`)
      # codesign 이 뜨지도 않을 승인 팝업을 기다리며 6시간을 매달렸다.
      #
      # ⚠️ 비밀번호를 **빈 문자열로 두지 않는다.** 빈 비번은 이 레포가 과거에 겪은
      #    `security` 실패의 원인이었다(예전 스텝 이름에 남아 있던 "빈암호 p12 이슈").
      #    fastlane 의 setup_ci 가 빈 비번을 쓰므로 그걸 쓰지 않고 여기서 직접 만든다.
      - name: 서명용 임시 키체인 준비 (인증서는 match 가 저장소에서 받아 설치)
        run: |
          set -e
          KC="$RUNNER_TEMP/app-signing.keychain-db"
          KC_PW="$(openssl rand -base64 16)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          echo "::add-mask::$KC_PW"
          echo "MATCH_KEYCHAIN_NAME=$KC"     >> "$GITHUB_ENV"
          echo "MATCH_KEYCHAIN_PASSWORD=$KC_PW" >> "$GITHUB_ENV"
          echo "✅ 임시 키체인 준비 완료 — match 가 여기에 인증서를 설치하고 partition list 를 잡는다"

      - name: 인증서 저장소 SSH 키 (deploy key 읽기전용, 개인토큰 미사용)
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$MATCH_DEPLOY_KEY" > ~/.ssh/match_deploy_key
          chmod 600 ~/.ssh/match_deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host github.com\n  IdentityFile ~/.ssh/match_deploy_key\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          echo "인증서 저장소 SSH 키 설정 완료"

      - name: TestFlight 업로드 (fastlane match + pilot)
        if: ${{ needs.resolve.outputs.ios_channel != 'firebase' }}
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.ASC_KEY_P8 }}
          APPSFLYER_IOS_APP_ID: ${{ secrets.APPSFLYER_IOS_APP_ID }}
        run: fastlane ios beta slug:"$SLUG"

      - name: iOS Firebase 인증 설정 확인
        if: ${{ needs.resolve.outputs.ios_channel != 'testflight' }}
        run: |
          test -n "$WIF_PROVIDER" && test -n "$WIF_SERVICE_ACCOUNT" || {
            echo "::error::iOS Firebase 배포용 WIF 변수가 필요합니다"; exit 1;
          }

      - name: iOS Firebase GCP 인증 (GitHub OIDC)
        if: ${{ needs.resolve.outputs.ios_channel != 'testflight' }}
        id: ios_firebase_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: iOS Firebase 업로드 (Ad Hoc 재서명)
        if: ${{ needs.resolve.outputs.ios_channel != 'testflight' }}
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.ASC_KEY_P8 }}
          FIREBASE_SERVICE_CREDENTIALS_FILE: ${{ steps.ios_firebase_auth.outputs.credentials_file_path }}
          FIREBASE_TESTER_GROUPS: ${{ needs.resolve.outputs.firebase_groups }}
          IOS_CHANNEL: ${{ needs.resolve.outputs.ios_channel }}
        run: |
          if [ "$IOS_CHANNEL" = both ]; then
            fastlane ios firebase slug:"$SLUG" skip_build:true
          else
            fastlane ios firebase slug:"$SLUG"
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ needs.resolve.outputs.ios_channel != 'testflight' }}
        with:
          name: ${{ env.SLUG }}-adhoc-ipa
          path: build/${{ env.SLUG }}/ios/firebase-output/*.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SLUG }}-ipa
          path: build/${{ env.SLUG }}/ios/output/*.ipa
          if-no-files-found: warn
